# Não afeta funcionamento, apenas nome da aplicação para logs e etc.
spring:
  application:
    name: appbarber

# Como o Spring se conecta ao banco
  datasource:
  # Endereço do JDBC do postgres (Host, porta, banco de dados)
    url: ${BARBER_DB_URL:jdbc:postgresql://localhost:5432/appbarber}
  # Usuário do banco de dados 
    username: ${BARBER_DB_USERNAME:postgres}
  # Senha do banco de dados    
    password: ${BARBER_DB_PASSWORD:postgres}
  # Driver que o Java vai usar para falar com o banco de dados
    driver-class-name: org.postgresql.Driver

  # Configuração do hibernate
  jpa:
  # Configurado para falhar caso as entidades não batam com o banco
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

  # Configuração do Flyway (Alterações no banco de dados, versionamento do banco)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
# configuração do servidor web embutido (Tomcat)
server:
  port: ${BARBER_SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${BARBER_JWT_SECRET:troque-esta-chave-de-desenvolvimento-appbarber-2026}
    expiracao-ms: ${BARBER_JWT_EXPIRACAO_MS:86400000}
    emissor: appbarber
  cors:
    allowed-origins: ${BARBER_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.barber.app: DEBUG
    org.hibernate.SQL: ${BARBER_LOG_SQL:INFO}
